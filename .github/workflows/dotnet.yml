name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      # -m:1 serializes the MSBuild graph to work around a known parallel-build
      # race in multi-target projects (BTCPayServer.Client / BTCPayServer.Common)
      # where the per-TFM GenerateDepsFile task can collide on the shared deps.json.
      run: dotnet build --no-restore -m:1
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Verify packaged plugin against BTCPay 2.4.2
      run: |
        dotnet publish BTCPayServer.Plugins.ArkPayServer -c Release -m:1 -o BTCPayServer.Plugins.ArkPayServer/bin/plugin-host/publish
        dotnet build submodules/btcpayserver/BTCPayServer.PluginPacker -c Release -m:1
        dotnet run --project submodules/btcpayserver/BTCPayServer.PluginPacker -c Release --no-build -- BTCPayServer.Plugins.ArkPayServer/bin/plugin-host/publish BTCPayServer.Plugins.ArkPayServer BTCPayServer.Plugins.ArkPayServer/bin/plugin-host/packages
        PACKAGE="$(find BTCPayServer.Plugins.ArkPayServer/bin/plugin-host/packages -name '*.btcpay' -print -quit)"
        export ARKADE_PLUGIN_PACKAGE="$(realpath "$PACKAGE")"
        dotnet test NArk.PluginHost.Tests -c Release -m:1 --logger 'console;verbosity=normal'
